<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Social Style Assessment</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="brand"><span class="brand-mark"></span> Social Style Assessment</div>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="form-page">
    <div class="card">
      <h2>Admin Log In</h2>
      <p class="lead">This login is for the admin only. Participants don't need an account — just <a href="/assessment">start the assessment</a> directly.</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="e.g. jane@example.com" autocomplete="email" />
          <div class="error-text" id="email-error"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password" />
          <div class="error-text" id="password-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log In</button>
      </form>

    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/js/app.js"></script>
  <script>
    (function () {
      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const emailError = document.getElementById('email-error');
      const passwordError = document.getElementById('password-error');
      const loginBtn = document.getElementById('login-btn');

      // If already logged in, skip straight to the assessment.
      getCurrentUser().then((user) => {
        if (user) window.location.href = '/assessment';
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        emailError.textContent = '';
        passwordError.textContent = '';

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email) {
          emailError.textContent = 'Email address is required.';
          return;
        }
        if (!password) {
          passwordError.textContent = 'Password is required.';
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Logging in…';

        try {
          await apiRequest('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          window.location.href = '/assessment';
        } catch {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Log In';
        }
      });
    })();
  </script>
</body>
</html>
